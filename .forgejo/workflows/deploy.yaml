name: deploy

# Deploys to Fly.io after code lands on main. Fly's remote builder runs the
# Dockerfile, which bakes the OurAirports data into the image: the weekly
# schedule redeploys so that data never goes more than a week stale.
on:
  push:
    branches:
      - main
    paths-ignore:
      - '.forgejo/workflows/renovate.yaml'
      - '.forgejo/workflows/ci.yaml'
      - '.forgejo/workflows/build.yaml'
      - 'LICENSE'
      - 'README.md'
      - 'AGENTS.md'
      - 'CLAUDE.md'
      - 'renovate.json5'
      - '.envrc'
      - '.gitignore'
      - 'justfile'
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: native
    steps:
      # Full history and tags: Go stamps the version from them.
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # A deploy token scoped to the ask app: fly tokens create deploy -a ask
      - name: Deploy
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          nix develop --command flyctl deploy --remote-only \
            --build-arg IMAGE_REVISION=${{ github.sha }} \
            --build-arg IMAGE_VERSION="$(git describe --tags --always)" \
            --build-arg IMAGE_CREATED="$(date -u +%Y-%m-%dT%H:%M:%SZ)"

      # A new machine, or a basemap past four weeks, extracts the Protomaps
      # build in the background. Polling keeps Fly from stopping the machine
      # before it is done, and shows the result here.
      - name: Wait for the map tiles
        shell: bash
        run: |
          for _ in $(seq 120); do
            tiles=$(curl -fsS --max-time 20 https://ask.fly.dev/health | grep -o '"tiles":"[a-z]*"' | cut -d'"' -f4) || tiles=unreachable
            echo "tiles: $tiles"
            case "$tiles" in
              ready) exit 0 ;;
              failed|disabled) exit 1 ;;
            esac
            sleep 30
          done
          echo "the basemap was still not ready after an hour"
          exit 1
