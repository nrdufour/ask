name: ci
on:
  push:
    branches:
      - main
    paths-ignore:
      - '.forgejo/workflows/renovate.yaml'
      - 'LICENSE'
      - 'README.md'
      - 'renovate.json5'
      - '.envrc'
      - '.gitignore'
      - 'default.nix'

jobs:
  docker:
    runs-on: native
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set build tag
        shell: bash
        run: |
          echo "BUILD_TAG=main-${GITHUB_SHA:0:7}-$(date +%s)" >> $GITHUB_ENV

      - name: Set build timestamp
        shell: bash
        run: |
          echo "BUILD_TIME=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> $GITHUB_ENV

      - name: Login to registry
        uses: docker/login-action@v4
        with:
          registry: forge.internal
          username: ${{ secrets.GIT_USERNAME }}
          password: ${{ secrets.GIT_PASSWORD }}

      # No QEMU and no builder setup: the runner supplies a buildx builder
      # spanning two NATIVE buildkitd nodes (amd64 on hawk, arm64 on opi03)
      # through BUILDX_BUILDER, so naming the platforms below is enough.
      #
      # See avalanche: docs/architecture/deployment/multi-arch-image-builds.md

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            IMAGE_REVISION=${{ github.sha }}
            IMAGE_CREATED=${{ env.BUILD_TIME }}
          tags: |
            forge.internal/nemo/ask:latest
            forge.internal/nemo/ask:${{ env.BUILD_TAG }}
