# fly.toml app configuration file generated for ask on 2025-09-20T09:14:42-04:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'ask'
primary_region = 'iad'

# The server runs in ~55 MB, but extracting the basemap (server/tiles.go)
# holds the z0-12 tile directories in memory: ~650 MB at peak. Swap lets
# that monthly job finish without paying for RAM the rest of the time.
swap_size_mb = 1024

[build]

# The self-hosted basemap (an 18 GB Protomaps extract) lives on a volume;
# the server keeps it fresh. See server/tiles.go.
[env]
  ASK_TILES = '/data/basemap.pmtiles'

[mounts]
  source = 'tiles'
  destination = '/data'
  initial_size = '25gb'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

  # Fails a deploy whose new machine never answers.
  [[http_service.checks]]
    grace_period = '10s'
    interval = '30s'
    method = 'GET'
    path = '/health'
    timeout = '5s'

[[vm]]
  memory = 256
  size = 'shared-cpu-1x'

[processes]
  app = ""
